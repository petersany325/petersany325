<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520">
  <style>
    .t { fill:#eaeaea; font-family:Segoe UI,Arial,sans-serif; font-size:16px; font-weight:700; }
    .b { fill:#111; stroke:#888; stroke-width:1.5; }
    .box { fill:#1e1e1e; stroke:#c9a227; stroke-width:1.5; }
    .box2 { fill:#1e1e1e; stroke:#5dade2; stroke-width:1.5; }
    .box3 { fill:#1e1e1e; stroke:#58d68d; stroke-width:1.5; }
    .l { fill:#ddd; font-family:Segoe UI,Arial,sans-serif; font-size:12px; }
    .s { fill:#999; font-family:Segoe UI,Arial,sans-serif; font-size:10px; }
    .w { stroke:#aaa; stroke-width:1.5; fill:none; }
    .w5 { stroke:#e74c3c; stroke-width:2; fill:none; }
    .wd { stroke:#5dade2; stroke-width:1.5; fill:none; }
  </style>
  <rect width="920" height="520" fill="#0d0d0d"/>
  <text x="24" y="32" class="t">JMS578 SATA to USB - Block Schematic</text>

  <rect x="30" y="70" width="120" height="70" rx="6" class="box2"/>
  <text x="55" y="100" class="l">USB-A Male</text>
  <text x="50" y="118" class="s">VBUS / D+/- / SS</text>

  <rect x="30" y="170" width="120" height="50" rx="6" class="box2"/>
  <text x="55" y="200" class="l">DC Jack 5V</text>

  <rect x="200" y="100" width="90" height="50" rx="6" class="b"/>
  <text x="212" y="130" class="l">ON / OFF</text>

  <path d="M150 105 H200" class="w5"/>
  <path d="M150 195 H245 V150" class="w5"/>
  <text x="155" y="95" class="s" style="fill:#e74c3c">5V OR</text>

  <rect x="340" y="60" width="220" height="200" rx="8" class="box"/>
  <text x="400" y="90" class="l" style="fill:#c9a227">U1 JMS578</text>
  <text x="360" y="115" class="s">USB3 to SATA bridge</text>
  <text x="360" y="140" class="s">+ internal 3V3 LDO</text>
  <text x="360" y="155" class="s">+ internal 1V2 buck</text>
  <text x="360" y="180" class="s">SPI / GPIO / REXT 12k</text>
  <text x="360" y="205" class="s">XTAL 30 MHz</text>
  <text x="360" y="230" class="s">UASP / BOT</text>

  <path d="M290 125 H340" class="w5"/>
  <text x="295" y="118" class="s" style="fill:#e74c3c">V5_SW</text>

  <rect x="380" y="290" width="140" height="50" rx="6" class="box"/>
  <text x="410" y="320" class="l">SPI Flash 512Kb</text>
  <path d="M450 260 V290" class="w"/>

  <rect x="380" y="370" width="140" height="40" rx="6" class="box"/>
  <text x="415" y="395" class="l">Crystal 30M</text>
  <path d="M450 340 V370" class="w"/>

  <rect x="640" y="80" width="240" height="100" rx="8" class="box3"/>
  <text x="700" y="115" class="l" style="fill:#58d68d">SATA 22-pin</text>
  <text x="670" y="140" class="s">A+/- / B+/- (10nF couple)</text>
  <text x="670" y="160" class="s">5V + GND to 2.5in drive</text>

  <path d="M560 120 H640" class="wd"/>
  <path d="M560 200 H600 V220 H700 V180" class="w5"/>
  <text x="570" y="110" class="s" style="fill:#5dade2">SATA data</text>
  <text x="610" y="215" class="s" style="fill:#e74c3c">SATA 5V</text>

  <rect x="640" y="220" width="240" height="70" rx="8" class="b"/>
  <text x="690" y="250" class="l">2.5in HDD / SSD</text>
  <text x="675" y="270" class="s">or factory SSD (SM2244LT)</text>
  <path d="M760 180 V220" class="w"/>

  <rect x="640" y="330" width="240" height="60" rx="6" class="b"/>
  <text x="700" y="355" class="l">Host PC USB3</text>
  <text x="680" y="375" class="s">MPTool / Explorer / dd</text>
  <path d="M90 70 V40 H760 V330" class="wd"/>

  <text x="24" y="480" class="s">See SCHEMATIC.md + nets.csv + bom.csv for full connectivity. Draw this in EasyEDA/KiCad before ordering Gerbers.</text>
  <text x="24" y="500" class="s">NOT for 3.5in drives (needs +12V). USB3 90 ohm, SATA 100 ohm, 2-layer (Top signal / Bottom GND).</text>
</svg>
