name: Deploy Windex WD demo (GitHub Pages)

on:
  push:
    branches:
      - cursor/wd-factory-desk-ui-proto-a3a0
    paths:
      - 'test-windex/WindexWD-Prototype-Test/resources/app/**'
      - '.github/workflows/deploy-windex-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-windex-wd
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: test-windex/WindexWD-Prototype-Test/resources/app
      - id: deployment
        uses: actions/deploy-pages@v4
