<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Factory Desk — Seller Keygen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="keygen-page">
  <main class="keygen-wrap">
    <header class="keygen-head">
      <span class="brand-mark">WD</span>
      <div>
        <h1>Seller Keygen</h1>
        <p>Issue serials for Factory Desk sales. Keep this page private.</p>
      </div>
    </header>

    <section class="keygen-panel">
      <label>Edition
        <select id="kgEdition">
          <option value="STD">Standard</option>
          <option value="PRO" selected>Professional</option>
          <option value="LAB">Lab / Multi-port</option>
        </select>
      </label>
      <label>Valid months
        <select id="kgMonths">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="6">6</option>
          <option value="12" selected>12</option>
          <option value="24">24</option>
          <option value="60">60 (≈5y)</option>
        </select>
      </label>
      <label>Customer Machine ID (for bound license)
        <input id="kgMid" type="text" placeholder="WDFD-M-XXXX-XXXX-XXXX-XXXX" spellcheck="false" />
      </label>
      <div class="keygen-actions">
        <button type="button" class="btn-primary" id="btnBound">Issue machine-bound key</button>
        <button type="button" class="btn-ghost" id="btnOpen">Issue open seat serial</button>
      </div>
      <label>Generated key
        <textarea id="kgOut" rows="3" readonly spellcheck="false"></textarea>
      </label>
      <button type="button" class="btn-ghost" id="btnCopy">Copy key</button>
      <p class="keygen-warn">Prototype keygen shares the demo HMAC material with the app. Production: private Ed25519 key stays only on your signing PC / server — never ship it with the product.</p>
      <p><a href="index.html">← Back to Factory Desk</a> · <a href="LICENSE-SYSTEM.md">Security model</a></p>
    </section>
  </main>
  <script src="license.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    function days() {
      return Math.round(parseInt($("#kgMonths").value, 10) * 30.44);
    }
    async function bound() {
      const mid = $("#kgMid").value.trim();
      if (!mid.startsWith("WDFD-M-")) {
        alert("Paste customer Machine ID (WDFD-M-…)");
        return;
      }
      const key = await License.issueBoundLicense({
        machineId: mid,
        edition: $("#kgEdition").value,
        daysValid: days()
      });
      $("#kgOut").value = key;
    }
    async function openSeat() {
      const key = await License.issueSerial({
        edition: $("#kgEdition").value,
        daysValid: days()
      });
      $("#kgOut").value = key;
    }
    $("#btnBound").onclick = bound;
    $("#btnOpen").onclick = openSeat;
    $("#btnCopy").onclick = async () => {
      const v = $("#kgOut").value.trim();
      if (!v) return;
      await navigator.clipboard.writeText(v);
      $("#btnCopy").textContent = "Copied";
      setTimeout(() => { $("#btnCopy").textContent = "Copy key"; }, 1200);
    };
  </script>
</body>
</html>
